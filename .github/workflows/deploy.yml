name: Deploy

on:
  push:
    branches:
      - master
      - main

# Never run two deploys at once; a newer push supersedes an in-flight build.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Deploy:
    name: Build & publish dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm build

      # Force-push the built bundle to a dedicated `production` branch so master
      # stays source-only. jsDelivr serves it from `@production`.
      - name: Publish dist to production branch
        run: |
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # jsDelivr caches the production branch at its edge (s-maxage 12h), so purge
      # it after each deploy to serve the new build immediately. Note this only
      # refreshes the CDN — browsers still honour the 7-day max-age, so the loader
      # needs its own cache-bust for returning visitors to pick changes up.
      - name: Purge jsDelivr cache
        run: |
          curl -sf "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@production/index.js" \
            || echo "jsDelivr purge failed (non-fatal)"
